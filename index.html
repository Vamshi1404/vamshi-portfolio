<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Loading portfolio.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f2ec">
<!--
  index.html contains STRUCTURE ONLY.

  Every piece of personal, project, skill and link content lives in content.js.
  The <title> and <meta name="description"> above are placeholders that main.js
  overwrites from content.js at runtime, so this file never needs editing when
  the portfolio is personalised.

  This is a static, build-free site: it runs from GitHub Pages, from a local
  file server, or from any plain HTTP host. No backend, no API, no env vars.
-->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  /* Set before first paint so reveal elements start in their hidden state and
     no content ever flashes in and out. The `html:not(.js)` rules in
     styles.css guarantee everything stays visible if scripting is off.

     The `js` class is also a promise: that main.js will replace the static
     shell with the real content from content.js. This block is the safety
     net for when that promise is broken -- a 404, a syntax error, or the page
     being opened straight off the filesystem, where module loading is blocked.
     Any of those would otherwise leave a blank page with no explanation, so we
     un-hide everything and say what went wrong instead. */
  (function () {
    var root = document.documentElement;
    var booted = false;
    root.classList.add('js');

    function fail(reason, detail) {
      if (booted) return;
      booted = true;
      root.classList.add('boot-failed');
      root.classList.remove('js');

      var box = document.createElement('div');
      box.className = 'bootnotice';
      box.setAttribute('role', 'alert');

      var h = document.createElement('p');
      h.className = 'bootnotice__title';
      h.textContent = reason;
      box.appendChild(h);

      var p = document.createElement('p');
      p.textContent = detail;
      box.appendChild(p);

      /* Advice depends on where the page runs: local filesystem openings
         need a server; live deployments need their files side by side. */
      var onFile = location.protocol === 'file:';
      var pre = document.createElement('pre');
      pre.className = 'bootnotice__cmd';
      pre.textContent = onFile
        ? 'cd vamshi-portfolio\npython -m http.server 8000'
        : 'index.html, content.js, main.js and styles.css\nmust sit side by side in the deployed folder.';
      box.appendChild(pre);

      var tail = document.createElement('p');
      tail.className = 'bootnotice__tail';
      tail.textContent = onFile
        ? 'then open http://localhost:8000'
        : 'On GitHub Pages this usually means the wrong publish folder was selected.';
      box.appendChild(tail);

      var mount = function () {
        (document.body || root).appendChild(box);
      };
      if (document.body) mount();
      else document.addEventListener('DOMContentLoaded', mount);
    }

    // Opened from the filesystem: ES modules and the import map are blocked by
    // the browser's file:// rules, so nothing can ever boot. Say so at once
    // rather than waiting for a timeout.
    if (location.protocol === 'file:') {
      fail('This page needs to be served over HTTP.',
           'Opening index.html directly from the filesystem blocks ES modules, ' +
           'so the content in content.js cannot load. Start a local server:');
      return;
    }

    // A load error or an uncaught throw anywhere: recover immediately.
    window.addEventListener('error', function (e) {
      var tag = e && e.target && e.target.tagName;
      if (tag === 'SCRIPT' || tag === 'LINK') {
        fail('A required file failed to load.',
             'The page could not load ' + ((e.target.src || e.target.href) || 'a dependency') +
             '. Check the file names and try reloading.');
      } else {
        fail('The page hit a scripting error.',
             'Rendering stopped early. The details are in the browser console.');
      }
    }, true);

    // Last resort: if main.js never reports success, un-hide the static shell.
    setTimeout(function () {
      if (window.__PLOT_BOOTED) return;
      fail('The portfolio did not finish loading.',
           'This usually means content.js or main.js could not be read. ' +
           'Check the deployed folder holds all four files, then reload:');
    }, 6000);
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ======================================================================
     FIXED CHROME
     - The masthead holds the wordmark and the anchor navigation.
     - The rail on the left is the chart spine; purely decorative.
     - The plotter pen is a desktop-only custom cursor, aria-hidden.
     ================================================================== -->
<header class="masthead" id="masthead">
  <div class="masthead__inner">
    <a class="wordmark" href="#top" aria-label="Back to top">
      <!-- Filled from content.js at runtime. Deliberately empty here so no
           personal detail is hardcoded in this file. -->
      <span class="wordmark__text" data-wordmark></span>
    </a>
    <nav class="nav" id="nav" aria-label="Section navigation" data-nav></nav>
    </div>
</header>

<div class="spine" aria-hidden="true">
  <span class="spine__ticks"></span>
</div>

<!-- Custom cursor. Desktop + fine pointer only, never on touch. -->
<div class="pen" data-pen aria-hidden="true">
  <svg class="pen__cross" viewBox="0 0 40 40" focusable="false">
    <path d="M20 4v9M20 27v9M4 20h9M27 20h9" />
    <circle cx="20" cy="20" r="1.6" class="pen__dot" />
  </svg>
  <span class="pen__label" data-pen-label></span>
  <span class="pen__coords" data-pen-coords>0.000 0.000</span>
</div>

<main id="main">

  <!-- ====================================================================
       01 — HERO
       Plain type on clean paper. No canvas, no terrain, no decoration.
       ================================================================== -->
  <section class="hero" id="top" aria-labelledby="hero-heading">
    <div class="hero__grid">
      <p class="hero__eyebrow mono" data-hero-eyebrow></p>

      <h1 class="hero__name" id="hero-heading" data-hero-name></h1>

      <p class="hero__positioning" data-hero-positioning></p>

      <p class="hero__statement" data-hero-statement></p>

      <div class="hero__actions">
        <a class="btn btn--primary" href="#work">Selected work</a>
        <a class="btn btn--ghost" href="#contact">Get in touch</a>
      </div>

      <dl class="plate plate--hero" data-hero-readouts aria-label="Key facts"></dl>
    </div>
  </section>

  <!-- ====================================================================
       02 — ABOUT
       Asymmetric editorial composition: a drop-capped biography spanning the
       main measure, with mono marginalia pinned into the outer gutter on
       wide viewports. There is no image-left / text-right split anywhere.
       ================================================================== -->
  <section class="section section--about" id="about" aria-labelledby="about-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>02</p>
        <h2 class="sec-head__label" id="about-heading" data-sec-label>About</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="about">
        <div class="about__lede">
          <p class="about__headline display" data-about-headline></p>
        </div>

        <div class="about__body">
          <div class="about__prose" data-about-body></div>

          <aside class="about__margin" aria-label="Marginalia">
            <dl data-about-marginalia></dl>
          </aside>
        </div>

        <dl class="spec" data-about-spec aria-label="Specification"></dl>
      </div>
    </div>
  </section>


  <!-- ====================================================================
       05 — TOOLKIT
       "The Stack": five groups rendered expanded. Each header is a real
       <button aria-expanded> controlling a real region, so the whole
       section is keyboard-operable and stays readable on mobile.
       No tag cloud, no progress bars, no percentages.
       ================================================================== -->
  <section class="section section--toolkit" id="toolkit" aria-labelledby="toolkit-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>03</p>
        <h2 class="sec-head__label" id="toolkit-heading" data-sec-label>The Stack</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="toolkit">
        <p class="toolkit__headline display" data-toolkit-headline></p>
        <p class="toolkit__lede" data-toolkit-lede></p>
        <div class="stack" data-toolkit-stack></div>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       03 — SELECTED WORK
       Rendered from content.js. Each project is title + description +
       Problem / System / Approach / Result + link + stack inside the same
       hairline plate frame. No diagrams, no captions — content only.
       ================================================================== -->
  <section class="section section--work" id="work" aria-labelledby="work-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>04</p>
        <h2 class="sec-head__label" id="work-heading" data-sec-label>Selected Work</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <p class="section__headline display" data-work-headline></p>

      <div class="plates" data-work-list></div>
    </div>
  </section>

  <!-- ====================================================================
       04 — OPEN SOURCE
       A technical annex, deliberately not a project plate: plain ground,
       a router diagram, and instrument readouts. One part of a broader
       practice — not the whole narrative.
       ================================================================== -->
  <section class="section section--oss" id="open-source" aria-labelledby="oss-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>05</p>
        <h2 class="sec-head__label" id="oss-heading" data-sec-label>Open Source</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div data-oss-list></div>
    </div>
  </section>

  <!-- ====================================================================
       06 — RECORD
       A chronological ledger. No employment history is invented:
       education is the anchor, open-source work supports it.
       ================================================================== -->
  <section class="section section--record" id="record" aria-labelledby="record-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>06</p>
        <h2 class="sec-head__label" id="record-heading" data-sec-label>Record</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="record">
        <p class="record__headline display" data-record-headline></p>
        <ol class="ledger" data-record-list></ol>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       07 — RESUME
       The resume as a themed sheet: same paper, ink, serif + mono voices.
       A download button prints this sheet alone to PDF — no backend.
       ================================================================== -->
  <section class="section section--resume" id="resume" aria-labelledby="resume-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>07</p>
        <h2 class="sec-head__label" id="resume-heading" data-sec-label>Resume</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="resume">
        <p class="resume__headline display" data-resume-headline></p>
        <p class="resume__lede" data-resume-lede></p>

        <div class="resume__actions">
          <a class="btn btn--primary" href="#" data-resume-download></a>
          <p class="resume__note mono" data-resume-note></p>
        </div>

        <article class="rsheet" data-resume-sheet aria-label="Resume"></article>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       08 — BEYOND THE STACK
       Personal and present: a large opening line plus two short paragraphs.
       No figures, no cards.
       ================================================================== -->
  <section class="section section--beyond" id="beyond" aria-labelledby="beyond-heading">
    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>08</p>
        <h2 class="sec-head__label" id="beyond-heading" data-sec-label>Beyond the Stack</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="beyond">
        <p class="beyond__lede display" data-beyond-lede></p>
        <div class="beyond__prose" data-beyond-body></div>
      </div>
    </div>
  </section>

  <!-- ====================================================================
       09 — CONTACT
       Plain closing: large statement, short lede, direct mailto CTA plus
       public profiles. No form, no tracking, no decorative figure.
       ================================================================== -->
  <section class="section section--contact" id="contact" aria-labelledby="contact-heading">

    <div class="wrap">
      <div class="sec-head" data-sec-head>
        <p class="sec-head__index mono" data-sec-index>09</p>
        <h2 class="sec-head__label" id="contact-heading" data-sec-label>Contact</h2>
        <p class="sec-head__note mono" data-sec-note></p>
      </div>

      <div class="contact__split">
        <div class="contact">
          <p class="contact__headline display" data-contact-headline></p>
          <p class="contact__lede" data-contact-lede></p>

          <div class="contact__cta">
            <a class="btn btn--primary btn--lg" href="#" data-contact-cta></a>
            <p class="contact__ctanote mono" data-contact-ctanote></p>
          </div>

          <dl class="contact__records" data-contact-records></dl>
        </div>

        <!-- Final thought, set beside the contact details. Typographic marks,
             small signature. No heading, no explanation, no decoration. -->
        <figure class="quote" aria-label="Closing thought">
          <blockquote class="quote__text display" data-quote>Learn from everything, for knowledge is the highest pursuit.</blockquote>
          <figcaption class="quote__sig mono">-me</figcaption>
        </figure>
      </div>
    </div>
  </section>

</main>

<!-- ======================================================================
     08 — FOOTER — technical colophon.
     ================================================================== -->
<footer class="colophon" id="colophon">
  <div class="wrap">
    <div class="colophon__grid">
      <div class="colophon__brand">
        <p class="colophon__name display" data-footer-name></p>
        <p class="colophon__role mono" data-footer-role></p>
      </div>
      <div class="colophon__meta">
        <p class="mono" data-footer-note></p>
        <p class="mono colophon__colophon" data-footer-colophon></p>
      </div>
      <div class="colophon__top">
        <a class="totop" href="#top" data-footer-totop></a>
      </div>
    </div>
  </div>
</footer>

<noscript>
  <div class="noscript">
    <p><strong>This portfolio renders its content with JavaScript.</strong></p>
    <p>Please enable JavaScript to read it. No content is hardcoded into this
      file &mdash; every detail lives in <code>content.js</code>, so it stays
      accurate as the portfolio is updated.</p>
  </div>
</noscript>

<!-- content.js first: it is plain data with no dependencies. -->
<script src="content.js"></script>
<!-- main.js is a module with no external dependencies: fully self-contained. -->
<script type="module" src="main.js"></script>

</body>
</html>
